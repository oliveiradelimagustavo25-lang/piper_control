controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: false
    # 2026-11-18 实测对比（controller_state 记录，31 次段末）：none 是零阶保持，
    # 指令呈台阶状，跟随误差翻转次数比 splines 高 5–27 倍、最大误差高 1.5–6 倍。
    # 因此维持 splines；起停顿挫的根因不在插值方式。
    interpolation_method: splines
    constraints:
      goal_time: 3.0
      joint1: {goal: 0.08}
      joint2: {goal: 0.08}
      joint3: {goal: 0.08}
      joint4: {goal: 0.08}
      joint5: {goal: 0.08}
      joint6: {goal: 0.08}

gripper_controller:
  ros__parameters:
    joints: [joint7, joint8]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 3.0
      joint7: {goal: 0.004}
      joint8: {goal: 0.004}
