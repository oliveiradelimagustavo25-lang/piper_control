task_planner:
  ros__parameters:
    objects_topic: /perception/objects
    action_name: /sorting/sort_objects
    pick_place_action: /manipulation/pick_place
    move_to_named_action: /manipulation/move_to_named
    recovery_service: /manipulation/release_held_object
    observation_target: pose_1
    observation_settle_time: 0.3
    reference_frame: base_link
    end_effector_frame: link6
    tool_to_tcp: [0.0, 0.0, 0.132]

    default_strategy: class_order
    default_class_order: []         # 使用类别表顺序；如 [1, 2, 3] 可筛选并指定类别优先级
    finish_mode: batch              # batch: 健康空闲后结束；watch: 持续等待
    idle_timeout: 3.0               # s，0 不自动结束
    # 槽位被占或候选持续被预检拒收时的等待上限，超时后按“无可用放置候选”结束。
    # 没有这个出口时，一次放置核验失败就能永久锁住只有一个槽位的类别。
    shortage_timeout: 30.0
    max_objects: 0                 # 0 不限；按已核验搬运次数计数
    retry_policy: priority         # priority / immediate / disabled
    max_attempts: 3                # 包含首次；不会因漏检而清零
    max_candidate_attempts: 2      # 单个放置候选被预检拒绝后的重试上限；环境变化可重评
    max_candidate_reevaluations: 1 # 场景变化后单个候选最多复活次数；0 不重评，避免冻结目标活锁
    retry_cooldown: 0.0            # s，默认重新观察后即可参与优先级选择
    on_attempts_exhausted: continue # continue: 其他物体继续；stop: 结束任务
    on_slots_full: wait            # wait / finish；不强行重叠放置
    placement_verification: visual # visual / motion（motion 仅确认运动流程）
    verification_timeout: 3.0      # s，回观察位后等待抓后核验
    slot_tolerance: 0.015          # m，物体中心到目标中心的水平距离容差
    height_tolerance: 0.006        # m，独立高度容差；高度异常或漏检先重新观察，不盲目重抓
    slot_clearance: 0.010          # m，方块之外的额外净空；运动路径仍由 MoveIt 检查
    max_observation_age: 2.0
    observation_timeout: 5.0       # s，等待异常的告警间隔，默认保留任务等待恢复
    action_timeout: 180.0          # s，超时请求取消，等待执行器返回状态
    recovery_timeout: 90.0         # s，不能确认恢复时结束，保留负载状态

    # 候选通道（可选）：/grasp/candidates 断流或过期时，派发自动退回传统固定向下抓取。
    # max_age 必须大于推理节拍（节流 5 s + 进程往返约 4.4 s）；过紧会让候选周期性
    # 被视为过期。
    # max_drift 是"物体自候选到达后允许的位移"，超出即弃用候选（物体已被推开）。
    grasp_candidates_topic: /grasp/candidates
    grasp_candidate_max_age: 20.0
    grasp_candidate_max_drift: 0.02

    # 空列表不限制区域。可填写 base_link 下的 xyz 下界/上界；放置点可在区内。
    workspace_min: []
    workspace_max: []

    # 以原点为中心、按间距在各类别区域内自动生成放置候选，不配置每类物体数量。
    # region: [xmin, ymin, xmax, ymax, 物体中心z]，m；可移动/扩大区域以适配工作台。
    # 规则入口位于总配置。独立启动时可在此配置 place_positions.<class_id>。
    # place_regions.<class_id> 为绝对区域 [xmin,ymin,xmax,ymax,z]：区域内按 placement_step
    # 生成候选，同类多物体依次填格；与 place_positions 同类互斥，且不受 X/Y/Z 模式影响。
    # place_regions.1: [0.25, -0.14, 0.39, -0.10, 0.015]
    # 未显式提供 place_positions 时使用下面区域；相对模式不能套用旧区域原点。
    place_position_modes: [absolute, absolute, absolute]
    placement_step: [0.04, 0.06]
    # 默认地面 Z=0，3 cm 方块放置中心为 Z=0.015 m。
    classes.1.place_position: [0.26, -0.12, 0.015]
    classes.1.place_region: [0.25, -0.14, 0.39, -0.10, 0.015]
    classes.2.place_position: [0.26, 0.0, 0.015]
    classes.2.place_region: [0.25, -0.06, 0.39, 0.06, 0.015]
    classes.3.place_position: [0.26, 0.12, 0.015]
    classes.3.place_region: [0.25, 0.10, 0.39, 0.14, 0.015]
    classes.4.place_position: [0.34, 0.12, 0.015]
    classes.4.place_region: [0.33, 0.10, 0.39, 0.14, 0.015]
    # 如需手动指定个别位置，classes.<class_id>.place_slots 的扁平 xyz 列表优先于 region。
